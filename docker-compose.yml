# Local development stack. For a server deployment use docker-compose.prod.yml.
services:
  frontend:
    build: ./frontend
    depends_on:
      - app
    ports:
      - "3000:80"
  app:
    build: .
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market_narrative
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "market"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

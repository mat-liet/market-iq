# Production stack for a single server. Only Caddy is reachable from outside:
# it terminates HTTPS, asks for the dashboard password, and proxies to the
# frontend, which in turn proxies the API. Postgres and the API have no
# published ports. Run with: docker compose -f docker-compose.prod.yml up -d --build
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    env_file: .env
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - app
    logging: *logging
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config:/app/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: market_narrative
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "market"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:

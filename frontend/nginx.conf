server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the read API to the backend service. Same origin as the SPA,
    # so the browser needs no CORS and the app needs no public exposure.
    location ~ ^/(health|report|articles|companies) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets — safe to cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: serve static files, else hand off to the client-side app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
